name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: joblinked_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm run lint
      - run: npm test
      - name: Integration tests (real Postgres)
        run: npm --prefix server run test:integration
        env:
          INTEGRATION_TEST: '1'
          INTEGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/joblinked_test
      - run: npm run build
      - name: Resume autofill eval (advisory)
        run: npm run eval:autofill
        continue-on-error: true
      - name: Audit root dependencies (advisory)
        run: npm audit --audit-level=high --dry-run
        continue-on-error: true
      - name: Audit server dependencies (advisory)
        run: npm --prefix server audit --audit-level=high --dry-run
        continue-on-error: true
      - name: Start preview
        run: npm run preview > /tmp/preview.log 2>&1 &
      - name: Public route sweep
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          npm run syscheck
